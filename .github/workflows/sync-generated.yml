name: 🔄 Sync Generated JS Files to React Repo

on:
  push:
    branches: [ main, test-github-workfow ]
    paths:
      - '_posts/**.md'          # Trigger only when markdown blog posts change
      - 'pythonScript/**'       # Or when the script itself is updated
  workflow_dispatch:
    inputs:
      use_pr:
        description: 'Create a pull request instead of pushing directly?'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout content repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pythonScript/requirements.txt

      - name: 🚀 Run generation script
        run: python pythonScript/generate_posts.py

      - name: 📁 Checkout React repository
        uses: actions/checkout@v4
        with:
          repository: jinroot/red_nexus_site
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: react-repo

      - name: 📋 Copy generated files to React repo
        run: |
          mkdir -p react-repo/frontend/src/BS/data/
          cp -r generated/* react-repo/frontend/src/BS/data/

      # ----- Direct push (original behaviour) -----
      # - name: 💾 Push directly to auto-updates branch
      #   if: github.event_name == 'push'
      #   run: |
      #     cd react-repo
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git checkout auto-updates 2>/dev/null || git checkout -b auto-updates
      #     git add frontend/src/BS/data/
      #     COMMIT_DATE=$(date +'%Y-%m-%d %H:%M:%S')
      #     COMMIT_MSG="chore: auto-update blog post data [${COMMIT_DATE}]"
      #     if git diff --cached --quiet; then
      #       echo "No changes to commit"
      #     else
      #       git commit -m "${COMMIT_MSG}"
      #       git push origin auto-updates --force
      #     fi

      # ----- Create a pull request (manual dispatch only) -----
      - name: 📬 Create Pull Request to main
        # if: github.event_name == 'workflow_dispatch' && github.event.inputs.use_pr == 'true'
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: react-repo
          branch: auto-update-blog-data
          base: main
          title: "📦 chore: auto-update blog post data"
          body: |
            This PR was automatically generated by the content repository workflow.

            **Triggered by:** @${{ github.actor }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the changes to the blog data files before merging.
          commit-message: "chore: auto-update blog post data"
          delete-branch: true
          labels: |
            automated
            blog-data