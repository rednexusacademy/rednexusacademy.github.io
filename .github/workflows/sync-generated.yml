name: 🔄 Sync Generated JS Files to React Repo (Test)

on:
  push:
    branches: [ main ]
    paths:
      - '_posts/**.md'          # Trigger only when markdown blog posts change
      - 'pythonScript/**'       # Or when the script itself is updated

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout content repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pythonScript/requirements.txt

      - name: 🚀 Run generation script
        run: python pythonScript/generate_posts.py

      - name: 📁 Checkout React repository
        uses: actions/checkout@v4
        with:
          repository: jinroot/red_nexus_site   
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: react-repo

      - name: 📋 Copy generated files to React repo
        run: |
          mkdir -p react-repo/frontend/src/BS/data/
          cp -r generated/* react-repo/frontend/src/BS/data/

      - name: 💾 Commit and push to React repo (branch-> auto-updates)
        run: |
          cd react-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to the target branch (create it if it doesn't exist)
          git checkout auto-updates 2>/dev/null || git checkout -b auto-updates

          # Add the generated files
          git add frontend/src/BS/data/

          # Prepare commit message with timestamp
          COMMIT_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          COMMIT_MSG="chore: auto-update blog post data [${COMMIT_DATE}]"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${COMMIT_MSG}"
            git push origin auto-updates --force
          fi